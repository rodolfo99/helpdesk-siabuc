server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: strict
spring:
  application:
    name: siabuc-helpdesk
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:siabuc_helpdesk}
    username: ${DB_USER:siabuc}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 5000
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  mvc:
    log-resolved-exception: false
app:
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:}
  admin-email: ${ADMIN_EMAIL:}
  cookie-secure: ${COOKIE_SECURE:false}
  mail:
    enabled: ${MAIL_ENABLED:false}
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    auth: ${SMTP_AUTH:true}
    security: ${SMTP_SECURITY:STARTTLS}
    from-address: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:SIABUC}
    reply-to: ${MAIL_REPLY_TO:}
    poll-ms: ${MAIL_POLL_MS:15000}
    max-attempts: ${MAIL_MAX_ATTEMPTS:5}
logging:
  level:
    org.springframework.security: WARN
