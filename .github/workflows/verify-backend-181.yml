name: Verify 1.8.1 backend regressions
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/verify-backend-181.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: siabuc_test
          POSTGRES_USER: siabuc
          POSTGRES_PASSWORD: DisposableBackend181
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U siabuc -d siabuc_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: siabuc_test
      DB_USER: siabuc
      DB_PASSWORD: DisposableBackend181
      MAIL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: PostgreSQL 17 integration and unit tests
        working-directory: backend
        run: |
          mvn --version
          for attempt in 1 2 3; do
            if mvn -B -ntp -U -Ppostgres-it verify > maven-verify.log 2>&1; then
              cat maven-verify.log
              exit 0
            fi
            cat maven-verify.log
            # Retry dependency transport failures only; assertion failures stop immediately.
            if ! grep -Eq 'Could not transfer artifact|Connection reset|Failed to read artifact descriptor|Could not resolve dependencies|could not be resolved' maven-verify.log; then
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
