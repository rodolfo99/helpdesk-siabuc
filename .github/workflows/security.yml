name: Dependency and image security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 14 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: frontend
            name: frontend
          - directory: tests/e2e
            name: browser-tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install the exact lockfile without lifecycle scripts
        working-directory: ${{ matrix.directory }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production and development dependencies
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=high --json > npm-audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit-${{ matrix.name }}
          path: ${{ matrix.directory }}/npm-audit.json
          if-no-files-found: error
          retention-days: 14
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend, backup, smtp, db]
    env:
      SERVICE: ${{ matrix.service }}
      IMAGE: siabuc-security-${{ matrix.service }}:${{ github.sha }}
      DB_NAME: siabuc_security
      DB_USER: siabuc
      DB_PASSWORD: DisposableSecurityDatabase185
      ADMIN_PASSWORD: DisposableSecurityAdmin185
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the final runtime image
        run: |
          docker build --pull --tag "$IMAGE" "$SERVICE"
          docker image inspect "$IMAGE" > image-inspect.json
      - name: Check the patched Node builder and final Nginx image
        if: matrix.service == 'frontend'
        run: |
          docker build --target build --tag siabuc-security-node frontend
          test "$(docker run --rm --entrypoint node siabuc-security-node -p process.versions.node)" = "$(cat .nvmrc)"
          docker run --rm --entrypoint sh "$IMAGE" -ec '
            nginx -v 2>&1 | grep -Fx "nginx version: nginx/1.30.6"
            nginx -t
            if command -v node || command -v npm; then
              echo "Unexpected build tools in the runtime image" >&2
              exit 1
            fi
            test -s /usr/share/nginx/html/index.html
          '
          container=$(docker run -d -p 127.0.0.1::80 "$IMAGE")
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          port=$(docker port "$container" 80/tcp | cut -d: -f2)
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 -D nginx-headers.txt "http://127.0.0.1:$port/" -o nginx-index.html
          curl --fail "http://127.0.0.1:$port/cases" -o nginx-route.html
          cmp nginx-index.html nginx-route.html
          grep -qi '^X-Content-Type-Options: nosniff' nginx-headers.txt
          grep -qi '^X-Frame-Options: DENY' nginx-headers.txt
      - name: Check backend runtime identity and packaged JAR
        if: matrix.service == 'backend'
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -ec '
            test "$(id -u)" = 10001
            test -s /app/app.jar
            java -version
            if command -v mvn; then exit 1; fi
          '
      - name: Scan OS and application packages (fail on HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          timeout: 10m0s
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: image-security-${{ matrix.service }}
          path: |
            image-inspect.json
            trivy.json
            nginx-headers.txt
          if-no-files-found: error
          retention-days: 14
  runtime-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the exact 1.8.4 SMTP build context
        run: |
          git fetch --depth 1 origin 979cbb5dcd94ab999214c056e50abe473743662c
          mkdir -p "$RUNNER_TEMP/legacy-smtp"
          for file in Dockerfile entrypoint.py healthcheck.py; do
            git show "979cbb5dcd94ab999214c056e50abe473743662c:smtp/$file" > "$RUNNER_TEMP/legacy-smtp/$file"
          done
      - name: Upgrade disposable data and SMTP queue; start final backend; dump and restore
        run: python3 tests/security/runtime_smoke.py --legacy-smtp "$RUNNER_TEMP/legacy-smtp"
