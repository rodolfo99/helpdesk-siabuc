version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /frontend
      - /tests/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories:
      - /frontend
      - /backend
      - /backup
      - /smtp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker-compose
    directories:
      - /
      - /backup
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
